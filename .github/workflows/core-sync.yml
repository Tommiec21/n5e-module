name: Core sync
# Daily check for a newer N5e shared rules core (King, November 14: the module checks once a day).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare the latest System release with the vendored core
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(gh api repos/Tommiec21/n5e-system/releases/latest --jq .tag_name)"
          CURRENT="v$(node -p "require('./module.json').flags?.n5eCore?.version ?? '0'")"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then echo "newer=false" >> "$GITHUB_OUTPUT"; else echo "newer=true" >> "$GITHUB_OUTPUT"; fi
      - name: Sync the core
        if: steps.v.outputs.newer == 'true'
        run: node tools/bounded.mjs 120000 node tools/sync-core.mjs ${{ steps.v.outputs.latest }}
      - name: Run core and adoption tests (no ledger attempt; the PR's validation gate counts)
        if: steps.v.outputs.newer == 'true'
        run: node tools/bounded.mjs 300000 node --import ./scripts/core/tests/core/setup.mjs --test --test-timeout=15000 tests/core-adoption.test.mjs tests/saves.test.mjs "scripts/core/tests/core/**/*.test.mjs"
      - name: Open a pull request
        if: steps.v.outputs.newer == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: core-sync/${{ steps.v.outputs.latest }}
          title: Core ${{ steps.v.outputs.latest }}
          commit-message: "Sync shared rules core ${{ steps.v.outputs.latest }}"
          body: Daily core sync from Tommiec21/n5e-system ${{ steps.v.outputs.latest }}. Core, adoption and saves tests passed in this run.
