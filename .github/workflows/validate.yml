name: Validate selected batch
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'prompts/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute selected gate once
        run: node tools/check.mjs selectedMechanics
      - name: Package without repeating checks
        run: node tools/bounded.mjs 60000 node tools/package.mjs
      - name: Upload exact checked artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundation-release
          path: dist/
      - name: Retain check ledger and process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: |
            docs/check-ledger.json
            work/*.json
